name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Node v${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install packages for project
        run: npm ci
      - name: Run type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify browser bundle exists
        run: |
          test -f build/resources/feedback.js || (echo "Error: build/resources/feedback.js not found" && exit 1)
        shell: bash
